[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "markora"
version = "1.1.0"
description = "Sovereign Markor-style Markdown Notebook, QuickNotes & Todo TUI for Terminal Power Users"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    { name = "zyekhabdul", email = "zyekhabdulqadirjailani@gmail.com" }
]
keywords = [
    "markora",
    "markor",
    "markdown",
    "notes",
    "notebook",
    "todo",
    "tui",
    "curses",
    "google-keep",
    "productivity",
    "cli",
    "terminal"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Editors",
    "Topic :: Utilities"
]
dependencies = []

[project.optional-dependencies]
keep = [
    "gkeepapi>=0.14.0",
    "gpsoauth>=1.0.0"
]
browser-auth = [
    "playwright>=1.40.0"
]
all = [
    "gkeepapi>=0.14.0",
    "gpsoauth>=1.0.0",
    "playwright>=1.40.0"
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "flake8>=6.0.0"
]

[project.scripts]
markora = "markora.cli:main"
td = "markora.cli:main"

[project.urls]
Homepage = "https://github.com/zyekhabdul/markora"
Repository = "https://github.com/zyekhabdul/markora.git"
Issues = "https://github.com/zyekhabdul/markora/issues"
Changelog = "https://github.com/zyekhabdul/markora/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
